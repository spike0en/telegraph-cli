[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegraph-cli"
version = "1.0.0"
description = "A high-performance CLI tool for publishing and managing Markdown/HTML articles on Telegra.ph and Graph.org"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Telegraph CLI Maintainers" }
]
dependencies = [
    "requests>=2.31.0",
    "markdown>=3.5",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
telegraph = "telegraph_api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
